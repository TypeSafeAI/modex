name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit + e2e (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests (core + desktop)
        run: npm test

      - name: Install browser for browser-dev e2e
        run: npx playwright install chromium
        working-directory: apps/desktop

      # Both Electron and browser dev use the offline mock backend; no CLI login is needed.
      - name: E2E (Electron and browser)
        run: npx playwright test
        working-directory: apps/desktop
        env:
          CI: "1"

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7
